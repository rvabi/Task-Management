<!DOCTYPE html>
<html>
<head>
    <title>Add Task - Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="populateUserDropdown()">

    <div class="container">
        <h1>Task Management System</h1>

        <div class="nav">
            <a href="users.html">Users</a>
            <a href="tasks.html">Tasks</a>
            <a href="add-task.html">Add Task</a>
            <a href="dashboard.html">Dashboard</a>
        </div>

        <h2>Add New Task</h2>

        <div class="card">
            <h3>Task Details</h3>

            <label>Task Title</label>
            <input type="text" id="title" placeholder="Enter task title">

            <label>Description</label>
            <textarea id="description" placeholder="Enter task description"></textarea>

            <label>Status</label>
            <select id="status">
                <option value="Todo">Todo</option>
                <option value="In Progress">In Progress</option>
                <option value="Done">Done</option>
            </select>

            <label>Assign User</label>
            <select id="userId">
                <option value="">Loading users...</option>
            </select>

            <button onclick="addTask()">Create Task</button>
            <a href="tasks.html" class="cancel-link">Back to Tasks</a>

            <div id="message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
