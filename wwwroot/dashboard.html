<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadDashboard()">

    <div class="container">
        <h1>Task Management System</h1>

        <div class="nav">
            <a href="users.html">Users</a>
            <a href="tasks.html">Tasks</a>
            <a href="add-task.html">Add Task</a>
            <a href="dashboard.html">Dashboard</a>
            
        </div>

        <h2>Dashboard</h2>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Todo</h3>
                <p id="todoTasks">0</p>
            </div>

            <div class="dashboard-card">
                <h3>In Progress</h3>
                <p id="inProgressTasks">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Done</h3>
                <p id="doneTasks">0</p>
            </div>
        </div>

        <div class="card">
            <h3>Recent Tasks</h3>

            <table>
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Assigned User</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody id="dashboardTaskBody">
                </tbody>
            </table>
        </div>

        <div id="message"></div>
    </div>

    <script src="app.js?v=13"></script>
</body>
</html>
