<!DOCTYPE html>
<html>
<head>
    <title>User Detail - Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadUserDetailPage()">

    <div class="container">
        <h1>Task Management System</h1>

        <div class="nav">
            <a href="users.html">Users</a>
            <a href="tasks.html">Tasks</a>
            <a href="add-task.html">Add Task</a>
            <a href="dashboard.html">Dashboard</a>
            
        </div>

        <h2>User Detail</h2>

        <div class="card">
            <h3>User Information</h3>

            <p><strong>User ID:</strong> <span id="detailUserId">-</span></p>
            <p><strong>User Name:</strong> <span id="detailUserName">-</span></p>
            <p><strong>Email:</strong> <span id="detailEmail">-</span></p>

            <a href="users.html" class="cancel-link">Back to Users</a>
        </div>

        <div class="card">
            <h3>Assigned Tasks</h3>

            <table>
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody id="userTaskTableBody">
                </tbody>
            </table>
        </div>

        <div id="message"></div>
    </div>

    <script src="app.js?v=14"></script>
</body>
</html>
