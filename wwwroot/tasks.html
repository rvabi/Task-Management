<!DOCTYPE html>
<html>
<head>
    <title>Tasks - Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadTasks()">

    <div class="container">
        <h1>Task Management System</h1>

        <div class="nav">
            <a href="users.html">Users</a>
            <a href="tasks.html">Tasks</a>
            <a href="add-task.html">Add Task</a>
            <a href="dashboard.html">Dashboard</a>
        </div>

        <h2>Task List</h2>

        <div class="card">
            <h3>Search Task</h3>

            <input type="text" id="searchInput" placeholder="Search task by title">

            <button onclick="searchTasks()">Search</button>
            <button onclick="clearSearch()">Clear</button>

            <div id="message"></div>
        </div>

        <div class="card">
            <h3>All Tasks</h3>

            <table>
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Assigned User</th>
                        <th>Created Date</th>
                        <th>Change Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
